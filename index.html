<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhvy7fzHq6bh3zJ0nOkhihQxB18QHtjrjq06U1VIJzFaFRcyxbDqd4txSo_hu5UkXl/exec";
    let state = { activePieceId: null, pieces: {}, history: [] };
    let activeBar = null;

    // --- 1. CLOUD SYNC LOGIC ---
    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL, { method: 'GET', redirect: 'follow' });
            state.history = await res.json();
            document.getElementById('sync-status').innerText = "Cloud Sync: Synced ✅";
            processHistory();
            updateUI();
        } catch (e) { document.getElementById('sync-status').innerText = "Cloud Sync: Offline ❌"; }
    }

    function processHistory() {
        state.pieces = {}; // Clear to rebuild
        state.history.forEach(row => {
            const id = row.piece.replace(/\s/g, '');
            if (!state.pieces[id]) {
                state.pieces[id] = { name: row.piece, totalBars: 100, currentRatings: {}, currentNotes: {} };
            }
            if (parseInt(row.bar) === 0) {
                state.pieces[id].totalBars = parseInt(row.rating); 
            } else {
                state.pieces[id].currentRatings[row.bar] = row.rating;
            }
        });
        if (!state.activePieceId && Object.keys(state.pieces).length > 0) {
            state.activePieceId = Object.keys(state.pieces)[0];
        }
    }

    async function saveSession() {
        const piece = state.pieces[state.activePieceId];
        const updates = Object.keys(piece.currentRatings).map(bar => ({
            piece: piece.name, 
            bar: parseInt(bar), 
            rating: piece.currentRatings[bar], 
            note: piece.currentNotes[bar] || "" 
        }));
        
        if (updates.length === 0) return alert("Nothing to sync.");

        document.getElementById('sync-status').innerText = "Cloud Sync: Saving...";
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ updates }) });
            piece.currentNotes = {}; // Wipe session notes after successful sync
            location.reload(); 
        } catch (e) { alert("Sync failed."); }
    }

    // --- 2. UI AND MODAL LOGIC ---
    function renderGrid() {
        const grid = document.getElementById('bar-grid');
        grid.innerHTML = '';
        const piece = state.pieces[state.activePieceId];
        if (!piece) return;
        
        for (let i = 1; i <= piece.totalBars; i++) {
            const div = document.createElement('div');
            div.className = `bar-box r-${piece.currentRatings[i] || ''}`;
            div.innerText = i;
            
            // BUG FIX: Route the click through the new openBarModal function
            div.onclick = () => openBarModal(i);
            grid.appendChild(div);
        }
    }

    // BUG FIX: This ensures the text box is accurate for the specific bar clicked
    function openBarModal(barNum) {
        activeBar = barNum;
        const piece = state.pieces[state.activePieceId];
        document.getElementById('modal-title').innerText = `Bar #${barNum}`;
        
        // Pull the specific note for this bar, or make the box blank
        document.getElementById('bar-note').value = piece.currentNotes[barNum] || "";
        document.getElementById('modal').style.display = 'block';
    }

    function setRating(r) {
        const piece = state.pieces[state.activePieceId];
        
        // Save the rating and the note exactly to this activeBar
        piece.currentRatings[activeBar] = r;
        piece.currentNotes[activeBar] = document.getElementById('bar-note').value;
        
        renderGrid();
        closeModal(); // BUG FIX: Close the modal so it resets for the next click
    }

    function closeModal() { 
        document.getElementById('modal').style.display = 'none'; 
    }

    function switchPiece() { 
        state.activePieceId = document.getElementById('piece-selector').value; 
        renderGrid(); 
    }

    function updateUI() {
        const sel = document.getElementById('piece-selector');
        sel.innerHTML = Object.keys(state.pieces).map(id => `<option value="${id}">${state.pieces[id].name}</option>`).join('');
        renderGrid();
    }

    async function addNewPiece() {
        const name = prompt("Piece Name:"); 
        const bars = prompt("Total Bars:");
        if (name && bars) {
            const id = name.replace(/\s/g, '');
            state.pieces[id] = { name, totalBars: parseInt(bars), currentRatings: {}, currentNotes: {} };
            
            const updates = [{ piece: name, bar: 0, rating: parseInt(bars), note: "METADATA" }];
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ updates }) });
            
            state.activePieceId = id; 
            updateUI();
        }
    }

    // Boot up
    loadData();
</script>
